<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#143735">
  <meta name="referrer" content="no-referrer">
  <title>滑雪后勤 · Dodge Ridge</title>
  <link rel="stylesheet" href="./styles.css?v=10">
  <style>
    .public-forecast-point {text-align:start}
    .public-forecast-point small {display:block;margin-top:.25rem}
    .public-road-list > summary {display:flex;justify-content:space-between;align-items:center;gap:.55rem}
    .public-road-list > summary span {color:var(--muted);font-size:.8rem}
    .public-evidence {max-height:19rem;overflow:auto}
    .public-forecast-day {text-align:start;min-width:4.6rem}
  </style>
</head>
<body>
  <a class="skip-link" href="#main" data-zh="跳到主要内容" data-en="Skip to main content">跳到主要内容</a>
  <header class="app-header">
    <div class="header-inner">
      <a class="brand" href="#verdict">
        <span class="brand-mark" aria-hidden="true"><i></i></span>
        <span data-zh="滑雪后勤" data-en="Ski logistics">滑雪后勤</span>
      </a>
      <div id="headerStatus" class="header-status" role="status" aria-live="polite"></div>
      <div class="header-actions">
        <button id="language" class="quiet" type="button" aria-label="Switch to English">EN</button>
        <button id="units" class="quiet" type="button" aria-label="切换为华氏温度">°C</button>
        <button id="refresh" class="refresh-button" type="button">刷新</button>
      </div>
    </div>
  </header>
  <div class="layout">
    <aside class="side">
      <nav class="section-nav" aria-label="导航" id="sectionNav">
        <div class="direction-switch" role="group" aria-labelledby="directionLabel">
          <span id="directionLabel" class="sr-only" data-zh="行车方向" data-en="Travel direction">行车方向</span>
          <a href="#roads" aria-controls="outbound-view" aria-current="location" data-zh="去程" data-en="Outbound">去程</a>
          <a href="#return-roads" aria-controls="return-view" data-zh="回程" data-en="Return">回程</a>
        </div>
        <a class="shared-weather-link" href="#weather" data-zh="天气与降雪" data-en="Weather &amp; snow">天气与降雪</a>
      </nav>
    </aside>
    <main id="main" tabindex="-1">
      <div id="outbound-view" class="direction-view">
        <section id="verdict" class="verdict hero" aria-label="出发判决" tabindex="-1">
          <h1>Santa Clara → Dodge Ridge</h1>
          <p>正在读取公开路况与预报…</p>
        </section>
        <section id="roads" class="section" aria-label="去程路况" tabindex="-1"></section>
      </div>
      <div id="return-view" class="direction-view" hidden>
        <header id="returnOverview" class="panel return-overview" tabindex="-1">
          <h1>回程概览</h1>
          <p>Dodge Ridge → Santa Clara</p>
        </header>
        <section id="return-roads" class="section" aria-label="回程路况" tabindex="-1"></section>
      </div>
      <section id="weather" class="section" aria-label="天气与降雪" tabindex="-1"></section>
      <footer class="panel"><p class="muted source-line" id="sourceCredit"></p></footer>
    </main>
  </div>
  <dialog id="forecastDialog" aria-labelledby="forecastTitle">
    <header class="dialog-header">
      <h2 id="forecastTitle"></h2>
      <form method="dialog"><button id="closeForecast" class="quiet close-button" type="submit" aria-label="关闭">×</button></form>
    </header>
    <div id="forecastBody" class="dialog-body"></div>
  </dialog>
  <noscript><p class="noscript">此看板需要 JavaScript。<a href="https://quickmap.dot.ca.gov/">查看 Caltrans QuickMap</a>。</p></noscript>
  <script type="module" src="./app.js?v=10"></script>
</body>
</html>
